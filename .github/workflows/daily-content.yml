name: Contenidos diarios (determinista)

on:
  schedule:
    # 06:40 UTC (08:40 ES) → piezas listas para la franja de mayor CTR de la mañana.
    - cron: '40 6 * * *'
    # 21:40 UTC (23:40 ES) → crónicas de los partidos de la noche.
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry-run (no escribe ni commitea)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  daily-content:
    name: Partidos de hoy · crónicas · previa · clasificación
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAPIDAPI_SPORTAPI_KEY: ${{ secrets.RAPIDAPI_SPORTAPI_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: true }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Snapshot SportAPI (jornadas oficiales; 50 peticiones al MES, solo lunes por la mañana)
        if: ${{ env.RAPIDAPI_SPORTAPI_KEY != '' && github.event.schedule == '40 6 * * *' }}
        env:
          RAPIDAPI_SPORTAPI_KEY: ${{ secrets.RAPIDAPI_SPORTAPI_KEY }}
        run: npx tsx scripts/sportapi/snapshot.ts --budget 8 --comps laliga,champions-league --weekday 1 || echo 'SportAPI sin cambios'
      - name: Snapshot UFC (Cito, cuota gratuita de 500 consultas al MES; 10 por minuto)
        if: ${{ github.event.schedule == '40 6 * * *' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 6
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: '[ -n "$CITO_API_KEY" ] && npx tsx scripts/ufc/snapshot.ts --budget 30 --monthly 450 || echo "UFC sin cambios"'
      - name: Snapshot F1 (Jolpica, trayectoria de pilotos; solo lunes por la mañana)
        if: ${{ github.event.schedule == '40 6 * * *' }}
        timeout-minutes: 8
        run: '[ "$(date -u +%u)" = 1 ] && npx tsx scripts/f1/snapshot.ts || echo "F1 sin cambios"'
      - name: Snapshot NFL avanzada (nflverse, probabilidad de victoria y EPA de quarterbacks)
        if: ${{ github.event.schedule == '40 6 * * *' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        run: npx tsx scripts/nfl/snapshot.ts || echo 'NFL sin cambios'
      - name: Snapshot Football Charts (Primera y Segunda Federación, minuto de goles; ~28 peticiones de 300/día sin clave)
        run: npx tsx scripts/footballcharts/snapshot.ts || echo 'Football Charts sin cambios'
      - name: Registro de canales de LaLiga y Champions (calculadora «¿cuánto cuesta ver a tu equipo?»)
        run: npx tsx scripts/tv-rights/snapshot.ts || echo 'Canales sin cambios'
      - name: Snapshot pádel (Padel API, plan gratuito; ~30 peticiones)
        env:
          PADELAPI_TOKEN: ${{ secrets.PADELAPI_TOKEN }}
        run: '[ -n "$PADELAPI_TOKEN" ] && npx tsx scripts/padel/snapshot.ts || echo "Pádel sin cambios"'
      - name: Snapshot OpenACB (Liga Endesa, estadísticas semanales)
        run: npx tsx scripts/openacb/snapshot.ts || echo 'OpenACB sin cambios'
      - name: Generar piezas
        env:
          DAILY_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
        run: npx tsx scripts/daily-content/build.ts --all
      - name: Commit y push si hay cambios
        if: ${{ github.event.inputs.dry != 'true' }}
        run: |
          set -e
          if git diff --quiet src/lib/news.ts src/data/sportapi-snapshot.json src/data/openacb-snapshot.json src/data/ufc-snapshot.json src/data/f1-pilotos.json src/data/nfl-advanced.json; then echo "Sin cambios."; exit 0; fi
          git config user.name "daily-content-bot"
          git config user.email "daily-content-bot@users.noreply.github.com"
          git add src/lib/news.ts src/data/sportapi-snapshot.json src/data/openacb-snapshot.json src/data/ufc-snapshot.json src/data/f1-pilotos.json src/data/nfl-advanced.json src/data/footballcharts.json src/data/tv-asignaciones.json src/data/padel.json
          git commit -m "auto(contenidos): piezas del $(date -u +%F)"
          git push origin HEAD:main
      # Vercel no está conectado a Git: sin este paso las piezas no llegan a
      # producción. Se activa solo cuando exista el secret VERCEL_TOKEN.
      - name: Desplegar a producción
        if: ${{ github.event.inputs.dry != 'true' && env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope danis-projects-9e355414
